# Theme
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"  # options: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# Site
locale: "en-US"
title: "Your Site Name"
title_separator: "-"
subtitle: "A short tagline"
description: "What your site is about"
url: "https://yourusername.github.io"
baseurl: ""
repository: "yourusername/yourusername.github.io"

# Author
author:
  name: "Your Name"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "A sentence or two about you."
  location: "Your City"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:you@example.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yourusername"

# Site footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yourusername"

# Build settings
markdown: kramdown
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Reading files
include:
  - _pages

# Defaults - controls layout for pages automatically
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
